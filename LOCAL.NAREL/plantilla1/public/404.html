<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página no encontrada — 404</title>
  <meta name="description" content="La página que buscas no existe o ha sido movida.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#2563eb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/404.css">
</head>
<body>

  <div class="page-404">
    <div class="container-404">
      <div class="error-visual" aria-hidden="true">
        <span class="error-num">4</span>
        <div class="error-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <span class="error-num">4</span>
      </div>

      <h1>Página no encontrada</h1>
      <p class="error-tagline">Lo sentimos, la página que buscas no existe, ha sido movida o no está disponible temporalmente.</p>

      <div class="error-actions">
        <a href="/#/home" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Volver al inicio
        </a>
        <a href="/#/contacto" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          Contactar
        </a>
      </div>

      <div class="error-help">
        <p>Si crees que se trata de un error, <a href="/#/contacto">contáctanos</a> y lo resolveremos.</p>
      </div>
    </div>

    <div class="bg-blob blob-1" aria-hidden="true"></div>
    <div class="bg-blob blob-2" aria-hidden="true"></div>
  </div>

</body>
</html>
