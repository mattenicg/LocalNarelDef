<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — NAREL LOCAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth-shared.css">
</head>
<body>

  <div class="topbar">
    <span>CREW N.L.</span><span>·</span><span>ENVÍOS A TODO EL PAÍS</span><span>·</span><span>UNA NUEVA VISIÓN</span>
  </div>

  <header>
    <a class="logo" href="/">
      <div class="logo-circle"><img src="/assets/img/logo-ngl-diamond.jpeg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;background:#000;" onerror="this.onerror=null;this.src='/logo_1.jpeg';var s2=function(){this.onerror=null;this.src='/logo%20solo.jpeg';this.addEventListener('error',function(){this.style.display='none';});}.bind(this);this.addEventListener('error',s2,{once:true});" /></div>
      <div class="logo-text">
        <span class="brand">NAREL LOCAL</span>
        <span class="tag">@narel_local</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="/">TIENDA</a>
      <a href="login.html">LOGIN</a>
      <a href="register.html" class="active">REGISTRO</a>
      <a href="dashboard.html">DASHBOARD</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Crear Cuenta</h1>
      <p class="auth-subtitle">SUMATE A LA CREW · NAREL LOCAL</p>

      <div id="formMessage" class="form-message"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Tu nombre" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repetir contraseña" required autocomplete="new-password">
        </div>

        <div style="margin:8px 0 24px;font:500 12px 'DM Mono',monospace;color:var(--grey);letter-spacing:.05em;line-height:1.6;">
          <label style="display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;">
            <input type="checkbox" id="terms" style="accent-color:var(--white);width:14px;height:14px;margin-top:2px;flex-shrink:0;" required>
            <span>Acepto los términos y condiciones de NAREL LOCAL · CREW N.L.</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="button primary">CREAR CUENTA</button>
      </form>

      <div class="auth-divider">
        ¿Ya tenés cuenta? <a href="login.html">INICIAR SESIÓN</a>
      </div>
    </div>
  </div>

  <div class="footer-auth">
    <strong>© 2026</strong> · NAREL LOCAL · CREW N.L.
  </div>

  <script src="assets/js/supabaseClientBrowser.js"></script>
  <script src="assets/js/authGuard.js"></script>
  <script src="assets/js/auth/register.js"></script>
</body>
</html>
