<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel Administrador - SaaS Comercial</title>
    <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body class="admin-body">
    <div class="loader-overlay" id="globalLoader" aria-hidden="true">
        <div class="spinner" role="status" aria-label="Cargando"></div>
    </div>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar" aria-label="Menú de navegación">
            <div class="sidebar-header">
                <svg class="brand-logo-sm" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="48" height="48" rx="12" fill="var(--color-primary, #6366f1)"/>
                    <path d="M24 14L14 34H20L22 28H26L28 34H34L24 14ZM23.2 24L24 19.6L24.8 24H23.2Z" fill="white"/>
                </svg>
                <div class="sidebar-brand-text">
                    <span class="brand-name" id="brandName">Panel Admin</span>
                </div>
                <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar menú">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <a href="#/dashboard" class="nav-item active" data-route="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#/clientes" class="nav-item" data-route="clientes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Clientes (Tenants)</span>
                </a>
                <a href="#/servicios" class="nav-item" data-route="servicios">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                        <line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                    <span>Servicios</span>
                </a>
                <a href="#/galeria" class="nav-item" data-route="galeria">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>Galería</span>
                </a>
                <a href="#/faq" class="nav-item" data-route="faq">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span>FAQ</span>
                </a>
                <a href="#/iak" class="nav-item" data-route="iak">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
                        <circle cx="7.5" cy="14.5" r="1"/>
                        <circle cx="16.5" cy="14.5" r="1"/>
                    </svg>
                    <span>Knowledge IA</span>
                </a>
                <a href="#/forms" class="nav-item" data-route="forms">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span>Formularios</span>
                    <span class="nav-badge hidden" id="badgeForms">0</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item nav-logout" id="logoutBtn" role="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Cerrar Sesión</span>
                </a>
            </nav>
        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

        <div class="main-wrapper">
            <header class="admin-header">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú de navegación" aria-controls="sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="header-title">
                    <h2 id="headerTitle">Dashboard</h2>
                </div>
                <div class="header-user">
                    <div class="header-avatar" id="headerAvatar" aria-hidden="true">A</div>
                    <span class="header-user-name" id="headerUserName">Administrador</span>
                </div>
            </header>

            <main class="main-content" id="view" role="main" aria-live="polite">
            </main>
        </div>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" id="modalRoot" role="document">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <dialog class="confirm-dialog" id="confirmDialog">
        <form method="dialog" class="confirm-form">
            <h3 class="confirm-title" id="confirmTitle">¿Estás seguro?</h3>
            <p class="confirm-message" id="confirmMessage">Esta acción no se puede deshacer.</p>
            <div class="confirm-actions">
                <button value="cancel" class="btn btn-outline">Cancelar</button>
                <button value="confirm" class="btn btn-danger" id="confirmBtn">Confirmar</button>
            </div>
        </form>
    </dialog>

    <script src="./assets/js/admin.js"></script>
</body>
</html>
