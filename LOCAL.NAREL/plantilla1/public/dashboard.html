<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta — NAREL LOCAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth-shared.css">
</head>
<body>

  <div class="topbar">
    <span>CREW N.L.</span><span>·</span><span>ENVÍOS A TODO EL PAÍS</span><span>·</span><span>UNA NUEVA VISIÓN</span>
  </div>

  <header>
    <a class="logo" href="/">
      <div class="logo-circle"><img src="/assets/img/logo-ngl-diamond.jpeg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;background:#000;" onerror="this.onerror=null;this.src='/logo_1.jpeg';var s2=function(){this.onerror=null;this.src='/logo%20solo.jpeg';this.addEventListener('error',function(){this.style.display='none';});}.bind(this);this.addEventListener('error',s2,{once:true});" /></div>
      <div class="logo-text">
        <span class="brand">NAREL LOCAL</span>
        <span class="tag">@narel_local</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="/">TIENDA</a>
      <a href="login.html">LOGIN</a>
      <a href="register.html">REGISTRO</a>
      <a href="dashboard.html" class="active">DASHBOARD</a>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-kicker" id="roleLabel">MI CUENTA</div>
    <h1 class="page-title" id="userName">Cargando...</h1>

    <div id="formMessage" class="form-message" style="max-width:720px;margin:0 0 30px;"></div>

    <div class="grid-cards">
      <div class="stat-card">
        <b id="userNameShort">-</b>
        <span>NOMBRE</span>
      </div>
      <div class="stat-card">
        <b id="userEmail">-</b>
        <span>CORREO</span>
      </div>
      <div class="stat-card">
        <b id="userRole" style="font-size:32px;letter-spacing:.1em;">-</b>
        <span>ROL</span>
      </div>
      <div class="stat-card">
        <b id="userId" style="font-family:'DM Mono',monospace;font-size:20px;">-</b>
        <span>ID · USUARIO</span>
      </div>
    </div>

    <div class="dashboard-actions">
      <a href="/" class="button secondary">VER TIENDA</a>
      <a href="#" id="adminBtn" class="button primary" style="display:none;">PANEL DE ADMINISTRACIÓN</a>
      <button id="logoutBtn" class="button primary">CERRAR SESIÓN</button>
    </div>
  </div>

  <div class="footer-auth">
    <strong>© 2026</strong> · NAREL LOCAL · CREW N.L.
  </div>

  <script src="assets/js/supabaseClientBrowser.js"></script>
  <script src="assets/js/authGuard.js"></script>
  <script src="assets/js/auth/dashboard.js"></script>
</body>
</html>
