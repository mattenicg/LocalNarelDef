<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña — NAREL LOCAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth-shared.css">
</head>
<body>

  <div class="topbar">
    <span>CREW N.L.</span><span>·</span><span>ENVÍOS A TODO EL PAÍS</span><span>·</span><span>UNA NUEVA VISIÓN</span>
  </div>

  <header>
    <a class="logo" href="/">
      <div class="logo-circle"><img src="/assets/img/logo-ngl-diamond.jpeg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;background:#000;" onerror="this.onerror=null;this.src='/logo_1.jpeg';var s2=function(){this.onerror=null;this.src='/logo%20solo.jpeg';this.addEventListener('error',function(){this.style.display='none';});}.bind(this);this.addEventListener('error',s2,{once:true});" /></div>
      <div class="logo-text">
        <span class="brand">NAREL LOCAL</span>
        <span class="tag">@narel_local</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="/">TIENDA</a>
      <a href="login.html">LOGIN</a>
      <a href="register.html">REGISTRO</a>
      <a href="dashboard.html">DASHBOARD</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Nueva Contraseña</h1>
      <p class="auth-subtitle">RESTABLECÉ TU ACCESO · CREW N.L.</p>

      <div id="formMessage" class="form-message"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="password">Nueva contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar nueva contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repetir contraseña" required autocomplete="new-password">
        </div>

        <input type="hidden" id="accessToken" name="access_token">

        <p style="font:400 12px 'DM Mono',monospace;color:var(--grey);letter-spacing:.05em;line-height:1.7;margin:0 0 24px;">
          Elegí una contraseña segura que no uses en otros sitios.
        </p>

        <button type="submit" id="submitBtn" class="button primary">GUARDAR CONTRASEÑA</button>
      </form>

      <div class="auth-divider">
        <a href="login.html">VOLVER AL LOGIN</a>
      </div>
    </div>
  </div>

  <div class="footer-auth">
    <strong>© 2026</strong> · NAREL LOCAL · CREW N.L.
  </div>

  <script src="assets/js/supabaseClientBrowser.js"></script>
  <script src="assets/js/authGuard.js"></script>
  <script src="assets/js/auth/reset.js"></script>
</body>
</html>
