services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: narel
      POSTGRES_PASSWORD: narel_dev_b44
      POSTGRES_DB: narel_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narel -d narel_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx nodemon --legacy-watch src/server.js"
    volumes:
      - ./LOCAL.NAREL/plantilla1:/app
      - app_node_modules:/app/node_modules
      - app_uploads:/app/uploads
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PUERTO: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: narel
      POSTGRES_PASSWORD: narel_dev_b44
      POSTGRES_DB: narel_local
      POSTGRES_SSL: "false"
      UPLOADS_DIR: /app/uploads
      UPLOADS_PUBLIC_PATH: /uploads
      ORIGIN_PERMITIDO: https://3000-${BASE44_PUBLIC_HOST_SUFFIX},http://localhost:3000
      PASSWORD_RESET_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/reset-password.html
      ADMIN_DEFAULT_EMAIL: admin@narel.local
      ADMIN_DEFAULT_PASSWORD: Admin1234!
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
  app_uploads:
